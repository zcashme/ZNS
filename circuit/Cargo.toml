[package]
name = "zns-schnorr"
version = "0.1.0"
edition = "2021"
description = "Pallas curve Schnorr signatures for ZNS name binding authorization"

[dependencies]
# Pallas curve arithmetic
pasta_curves = { version = "0.5", features = ["alloc"] }
group = "0.13"
ff = "0.13"

# Hashing (for challenge generation)
blake2b_simd = "1"

# Random number generation
rand = "0.8"

# Serialization
hex = "0.4"

# CLI and errors
inquire = "0.7"
anyhow = "1.0"

# Zcash address parsing and key derivation
zcash_address = "0.10.1"
orchard = "0.10"

# For seed phrase parsing
bip0039 = "0.12"

[dev-dependencies]
rand_core = "0.6"
