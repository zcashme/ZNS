[workspace]
members = [".", "service", "contract"]
resolver = "2"

# Required so that path dependencies into near-mpc/crates can resolve
# workspace inheritance keys (edition, license, etc.).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/near/mpc"

[workspace.dependencies]
mpc-primitives = { path = "near-mpc/crates/primitives" }
near-mpc-bounded-collections = { path = "near-mpc/crates/near-mpc-bounded-collections" }
near-mpc-crypto-types = { path = "near-mpc/crates/near-mpc-crypto-types" }
near-mpc-contract-interface = { path = "near-mpc/crates/near-mpc-contract-interface" }
assert_matches = "1.5.0"
blstrs = "0.7.1"
borsh = { version = "1.6.1", features = ["derive"] }
bs58 = "0.5.1"
curve25519-dalek = { version = "4.1.3", features = ["group", "serde"], default-features = false }
derive_more = { version = "2.1.1", features = ["as_ref", "constructor", "deref", "deref_mut", "display", "from", "from_str", "into"] }
ed25519-dalek = { version = "2.2.0", features = ["serde", "digest", "pkcs8", "rand_core"] }
group = "0.13"
hex = { version = "0.4.3", features = ["serde"] }
insta = { version = "1.46.3", features = ["json", "redactions"] }
k256 = "0.13.4"
near-account-id = { version = "2.5.0", features = ["borsh", "serde"] }
near-sdk = { version = "5.26.1", features = ["legacy", "unit-testing", "unstable"] }
rand = "0.8.6"
rstest = "0.26.1"
schemars = "0.8.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.20"
serde_with = { version = "3.17.0", features = ["hex"] }
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0.18"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("abi"))',
] }

[workspace.lints.clippy]
assertions_on_result_states = "warn"
allow_attributes = "warn"
mod_module_files = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[package]
name = "zns-indexer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
testnet = []
mainnet = []

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
zcash_client_backend = { version = "0.21", features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "orchard"] }
orchard = { version = "0.11", default-features = false }
zcash_note_encryption = "0.4"
zcash_keys = { version = "0.12", features = ["orchard"] }
zcash_primitives = "0.26"
zcash_protocol = "0.7"
zip32 = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"], default-features = false }
zcash_address = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
