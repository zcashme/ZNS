[package]
name = "zns-custody-service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "zns-custody-service"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "http2"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }

# HTTP API
axum = "0.7"
tower = "0.5"

# NEAR (only for raw JSON-RPC to v1.signer and basic account ops)
near-jsonrpc-client = "0.16"
near-jsonrpc-primitives = "0.29"
near-primitives = "0.29"
near-crypto = "0.29"

# TLS / rustls crypto provider for HTTPS (near-jsonrpc-client -> reqwest -> rustls)
rustls = { version = "0.23", features = ["ring"], default-features = false }

# Zcash lightwalletd + tx construction
zcash_client_backend = { version = "0.21", features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "orchard"] }
zcash_primitives = "0.26"
zcash_protocol = "0.7"
zcash_address = "0.10"
zcash_keys = { version = "0.12", features = ["orchard", "transparent-inputs"] }
orchard = { version = "0.11", default-features = false }
tonic = { version = "0.14", features = ["transport", "tls-webpki-roots"] }
rand = "0.8"
rand_chacha = "0.3"
zcash_transparent = { version = "0.6", features = ["transparent-inputs"] }
zcash_script = "0.4"
blake2b_simd = "1"

# Encoding / hashing
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }

# Signing
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Local state
rusqlite = { version = "0.32", features = ["bundled"] }

# Time / sync
tokio-util = "0.7"

[dev-dependencies]
tokio-test = "0.4"
