[package]
name = "zns-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust SDK for the Zcash Name System (ZNS) — types, verification, and action builders"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2"
base64 = "0.22"
zcash_protocol = "0.7"
